    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
      #root { width: 100%; height: 100%; }

      /* SANAL İMLEÇ HOVER EFEKTLERİ */
      /* El ile üzerine gelinen öğeler için zorla hover durumu yaratır */
      .hand-hover-active {
        transform: scale(1.15) !important; /* Büyütme efekti */
        filter: brightness(1.3) contrast(1.1) !important; /* Parlaklık artışı */
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.4) !important; /* Glow efekti */
        z-index: 1000 !important; /* Öne çıkarma */
        transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
        cursor: pointer !important;
      }
      
      /* Buton içindeki ikonların da hareket etmesini sağla */
      .hand-hover-active svg {
        transform: scale(1.1);
        transition: transform 0.2s;
      }
    </style>
